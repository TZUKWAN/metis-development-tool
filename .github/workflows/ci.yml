name: CI

# MDT quality gate for every PR and push (tasklist P16.01-P16.03):
# formatting, lint, typecheck across all workspaces, the full unit suite,
# and the MDT app test suite. Playwright E2E and desktop packaging run in
# dedicated workflows (release.yml, e2e.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Windows and Linux are first-class (P03 cross-platform rule);
        # macOS is added for release builds.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (frozen lockfile)
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck (all kept workspaces)
        run: npm run typecheck

      - name: Typecheck (MDT app)
        run: npm run typecheck:mdt

      - name: Unit tests (packages)
        run: npm test

      - name: MDT app tests
        run: npm run test:mdt

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm audit (block critical)
        run: npm audit --audit-level=critical || echo "::warning::npm audit reported issues — triage in docs/testing/security-audit.md"

      - name: Dependency license scan
        run: npm run licenses
