name: Release

# Tag-triggered desktop builds + source archive + SBOM (tasklist P16.04-P16.10).
# Artifacts are UNSIGNED at 1.0 — documented in SECURITY.md and
# docs/release/RELEASE_CHECKLIST.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (frozen)
        run: npm ci

      - name: Build desktop artifact
        run: npm run ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdt-${{ matrix.os }}
          path: |
            apps/mdt/release/*.exe
            apps/mdt/release/*.dmg
            apps/mdt/release/*.AppImage
            apps/mdt/release/*.deb
            apps/mdt/release/*.rpm
            apps/mdt/release/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Source archive (with LICENSE/NOTICE)
        run: |
          git archive --format=tar.gz --prefix=metis-development-tool/ -o dist/mdt-source.tar.gz "$GITHUB_REF"
          git archive --format=zip --prefix=metis-development-tool/ -o dist/mdt-source.zip "$GITHUB_REF"

      - name: SBOM (CycloneDX)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --output-file dist/mdt-sbom.json
          npx --yes @cyclonedx/cyclonedx-npm --output-file dist/mdt-sbom.json --omit dev || true

      - name: Checksums
        run: |
          cd dist
          find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.json' \) -exec sha256sum {} \; > SHA256SUMS.txt

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
            !dist/**/artifact-metadata.json
          generate_release_notes: true
